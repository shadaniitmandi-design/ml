services:
  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "4173:80"

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://kpdevcell:kpdevcell@db:5432/kpdevcell
      CORS_ORIGINS: http://localhost:4173,http://localhost:5173
      DEV_AUTH_BYPASS: "true"
      DEV_ADMIN_EMAIL: admin@kpdevcell.dev
      ADMIN_EMAILS: admin@kpdevcell.dev
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/app/uploads

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kpdevcell
      POSTGRES_USER: kpdevcell
      POSTGRES_PASSWORD: kpdevcell
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  uploads:

